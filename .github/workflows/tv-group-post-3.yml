name: tv-group-post-3
# One-off: posts the corrected Persian indicator and one Persian note to the BAROBAX group (owner t206u, Persian rewrite).
on:
  push:
    branches: [tv-group-post-3]
permissions:
  contents: read
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Send to group
        env:
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 tradingview/post3/send.py
