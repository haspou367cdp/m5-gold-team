name: tv-group-post-4
# One-off: posts the final Persian + English indicator files and the Persian note to the BAROBAX group (owner approved).
on:
  push:
    branches: [tv-group-post-4]
permissions:
  contents: read
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Send to group
        env:
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 tradingview/post4/send.py
