name: group-guide-post
# One-off: posts the Xauscalper Map indicator files and the group guide to the BAROBAX group (owner t238u).
# Runs only on pushes to branch group-guide-post. The token stays in GitHub secrets and is never printed.
on:
  push:
    branches: [group-guide-post]
permissions:
  contents: read
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Send to group
        env:
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 post/send.py
